name: CI

# Runs on every push and pull request. `check` covers lint, unit tests for both artifacts,
# apiCheck, checkNoopApiParity and the sample's merged-manifest checks; assembling both
# sample variants proves the same call sites compile against the real library and the no-op.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check
        run: ./gradlew check :sample:assembleDebug :sample:assembleRelease --stacktrace
