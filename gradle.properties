# ⚠ This file is committed to git — do NOT put secrets here.
# Maven Central token (mavenCentralUsername/Password) and GPG signing keys
# belong in ~/.gradle/gradle.properties (home dir, never in the repo). See PUBLISHING.md.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---- Publishing (read by the vanniktech maven-publish plugin) ---------------
# Shared by every published module. A module overrides POM_ARTIFACT_ID / POM_NAME /
# POM_DESCRIPTION in its own gradle.properties (see noop/gradle.properties).
# Both artifacts always ship with the same VERSION_NAME.
GROUP=com.anshulpatro
VERSION_NAME=0.2.1

SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=true

POM_ARTIFACT_ID=floatinginspector
POM_NAME=FloatingInspector
POM_DESCRIPTION=Debug-only floating overlay for printing live debug messages on-device.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/anshulpatro/FloatingInspector

POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/anshulpatro/FloatingInspector
POM_SCM_CONNECTION=scm:git:git://github.com/anshulpatro/FloatingInspector.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/anshulpatro/FloatingInspector.git

POM_DEVELOPER_ID=anshulpatro
POM_DEVELOPER_NAME=Anshul Patro
POM_DEVELOPER_URL=https://github.com/anshulpatro
